# Fluent Bit Configuration with Regex Sensitive Data Redaction
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: monitoring
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*railcloud*.log
        Parser            docker
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Merge_Log           On
        Keep_Log            Off

    # Strict Redaction Filters: Mask Passwords, JWTs, and Credit Cards
    [FILTER]
        Name          rewrite_tag
        Match         kube.*
        Rule          $log "(password|secret|token|bearer|cvv)" redacted.$TAG false

    [FILTER]
        Name          modify
        Match         kube.*
        Condition     Key_Value_Matches log "(?i)(password|jwt|token|bearer)"
        Set           redacted_flag true

    [OUTPUT]
        Name          cloudwatch_logs
        Match         kube.*
        region        us-east-1
        log_group_name /aws/k8s/railcloud-production/pods
        log_stream_prefix fluent-bit-
        auto_create_group true
